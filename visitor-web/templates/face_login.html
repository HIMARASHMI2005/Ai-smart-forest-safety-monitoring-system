<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biometric Face Login - Smart Forest</title>
  <link rel="stylesheet" href="/visitor/static/css/visitor.css">
</head>
<body>
  <header class="visitor-app-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="background: var(--accent-safe); color: #FFF; font-weight: bold; padding: 2px 6px; border-radius: 3px; font-family: var(--font-mono);">SF</div>
      <strong style="text-transform: uppercase;">Biometric Login</strong>
    </div>
    <a href="/visitor/login" class="btn" style="padding: 4px 8px; font-size: 11px;">PASSWORD LOGIN</a>
  </header>

  <main class="visitor-container">
    <div class="card">
      <div class="card-title">
        <span>BIOMETRIC FACE VERIFICATION</span>
        <span class="badge badge-safe">1:N MATCH</span>
      </div>

      <div class="camera-box">
        <video id="login-face-video" playsinline muted autoplay style="width: 100%; height: 100%; object-fit: cover;"></video>
        <canvas id="login-face-canvas" style="display: none;"></canvas>
        <div class="face-oval-guide"></div>
      </div>

      <div id="login-face-feedback" style="font-family: var(--font-mono); font-size: 11px; margin: 12px 0; text-align: center; color: var(--text-muted);">
        Align your face in the camera preview and press scan.
      </div>

      <button id="btn-verify-face" class="btn btn-primary btn-block">SCAN & VERIFY IDENTITY</button>

      <div style="margin-top: 14px; text-align: center;">
        <a href="/visitor/login" style="color: var(--text-muted); font-size: 12px; text-decoration: none;">Use email & password instead</a>
      </div>
    </div>
  </main>

  <script src="/visitor/static/js/auth.js"></script>
  <script src="/visitor/static/js/face_login.js"></script>
</body>
</html>
