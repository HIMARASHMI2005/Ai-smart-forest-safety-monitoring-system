<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biometric Face Registration - Smart Forest</title>
  <link rel="stylesheet" href="/visitor/static/css/visitor.css">
</head>
<body>
  <header class="visitor-app-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="background: var(--accent-safe); color: #FFF; font-weight: bold; padding: 2px 6px; border-radius: 3px; font-family: var(--font-mono);">SF</div>
      <strong style="text-transform: uppercase;">Biometric Enrollment</strong>
    </div>
    <span class="badge badge-safe">ForestFaceNet 128-D</span>
  </header>

  <main class="visitor-container">
    <div class="card">
      <div class="card-title">
        <span id="pose-title">Pose 1 of 5: Front View</span>
        <span class="badge badge-warning">ENROLLMENT</span>
      </div>

      <!-- Progress bar -->
      <div style="width: 100%; height: 4px; background: var(--bg-surface-elevated); border-radius: 2px; margin-bottom: 12px; overflow: hidden;">
        <div id="pose-progress" style="width: 0%; height: 100%; background: var(--accent-safe); transition: width 0.3s;"></div>
      </div>

      <div class="camera-box">
        <video id="face-video" playsinline muted autoplay style="width: 100%; height: 100%; object-fit: cover;"></video>
        <canvas id="face-canvas" style="display: none;"></canvas>
        <div class="face-oval-guide"></div>
      </div>

      <div id="face-feedback" style="font-family: var(--font-mono); font-size: 11px; margin: 12px 0; text-align: center; color: var(--text-muted);">
        Position your face inside the dashed oval and maintain steady lighting.
      </div>

      <button id="btn-capture-pose" class="btn btn-primary btn-block">CAPTURE & ENROLL POSE</button>

      <div style="margin-top: 14px; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); line-height: 1.5; text-align: center;">
        ZERO PRETRAINED WEIGHTS &bull; KAIMING HE INITIALIZATION<br/>
        Only 128-D unit vectors are stored in biometric_templates. Raw facial images are discarded.
      </div>
    </div>
  </main>

  <script src="/visitor/static/js/auth.js"></script>
  <script src="/visitor/static/js/face_registration.js"></script>
</body>
</html>
