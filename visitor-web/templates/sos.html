<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Distress SOS - Smart Forest</title>
  <link rel="stylesheet" href="/visitor/static/css/visitor.css">
</head>
<body>
  <header class="visitor-app-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <a href="/visitor/dashboard" class="btn" style="padding: 2px 8px; font-size: 11px;">&larr; BACK</a>
      <strong style="text-transform: uppercase;">Emergency Dispatch</strong>
    </div>
  </header>

  <main class="visitor-container" style="justify-content: center;">
    <div class="card" style="border-color: var(--accent-critical);">
      <div class="card-title" style="color: #FF4D4D;">TACTICAL MAYDAY TRIGGER</div>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">
        Double-tap below to initiate live distress beacon and continuous video chunk uploads to the nearest Search & Rescue team.
      </p>
      <button id="btn-main-sos" class="sos-trigger-btn">EMERGENCY SOS</button>
    </div>
  </main>

  <script src="/visitor/static/js/auth.js"></script>
  <script src="/visitor/static/js/gps.js"></script>
  <script src="/visitor/static/js/sos.js"></script>
</body>
</html>
