<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Registration - Smart Forest</title>
  <link rel="stylesheet" href="/visitor/static/css/visitor.css">
</head>
<body>
  <header class="visitor-app-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="background: var(--accent-safe); color: #FFF; font-weight: bold; padding: 2px 6px; border-radius: 3px; font-family: var(--font-mono);">SF</div>
      <strong style="text-transform: uppercase;">Visitor Portal</strong>
    </div>
    <a href="/visitor/login" class="btn" style="padding: 4px 8px; font-size: 11px;">LOGIN</a>
  </header>

  <main class="visitor-container" style="justify-content: center;">
    <div class="card">
      <div class="card-title">NEW VISITOR REGISTRATION</div>
      <form id="register-form">
        <div class="form-group">
          <label class="form-label">FULL NAME</label>
          <input type="text" id="full_name" class="form-input" required placeholder="Dr. Jane Doe">
        </div>
        <div class="form-group">
          <label class="form-label">EMAIL ADDRESS</label>
          <input type="email" id="email" class="form-input" required placeholder="visitor@wildland.org">
        </div>
        <div class="form-group">
          <label class="form-label">PASSWORD</label>
          <input type="password" id="password" class="form-input" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label class="form-label">MOBILE PHONE (SAR SMS LINK)</label>
          <input type="tel" id="phone" class="form-input" required placeholder="+91 98765 43210">
        </div>
        <div class="form-group">
          <label class="form-label">EMERGENCY CONTACT PERSON</label>
          <input type="text" id="emergency_name" class="form-input" required placeholder="Sarah Doe (Spouse/Relative)">
        </div>
        <div class="form-group">
          <label class="form-label">EMERGENCY CONTACT PHONE</label>
          <input type="tel" id="emergency_phone" class="form-input" required placeholder="+91 98765 12345">
        </div>
        <div id="reg-error" style="color: #FF4D4D; font-family: var(--font-mono); font-size: 11px; margin-bottom: 12px; display: none;"></div>
        <button type="submit" class="btn btn-primary btn-block">REGISTER & PROCEED TO FACE SCAN</button>
      </form>
    </div>
  </main>

  <script src="/visitor/static/js/auth.js"></script>
  <script>
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        role: "VISITOR",
        full_name: document.getElementById("full_name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        phone: document.getElementById("phone").value,
        emergency_contact_name: document.getElementById("emergency_name").value,
        emergency_contact_phone: document.getElementById("emergency_phone").value
      };

      const errEl = document.getElementById("reg-error");
      errEl.style.display = "none";

      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          VisitorAuth.setSession(data.token, data.user, data.profile);
          // Redirect to guided face registration
          window.location.href = "/visitor/face-registration";
        } else {
          errEl.textContent = data.error || "Registration failed.";
          errEl.style.display = "block";
        }
      } catch (err) {
        errEl.textContent = "Unable to connect to gateway.";
        errEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
