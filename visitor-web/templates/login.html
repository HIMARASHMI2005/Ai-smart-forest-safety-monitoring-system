<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Login - Smart Forest</title>
  <link rel="stylesheet" href="/visitor/static/css/visitor.css">
</head>
<body>
  <header class="visitor-app-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="background: var(--accent-safe); color: #FFF; font-weight: bold; padding: 2px 6px; border-radius: 3px; font-family: var(--font-mono);">SF</div>
      <strong style="text-transform: uppercase;">Visitor Portal</strong>
    </div>
    <a href="/visitor/register" class="btn" style="padding: 4px 8px; font-size: 11px;">REGISTER</a>
  </header>

  <main class="visitor-container" style="justify-content: center;">
    <div class="card">
      <div class="card-title">VISITOR SECURE LOGIN</div>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label">EMAIL ADDRESS</label>
          <input type="email" id="email" class="form-input" required placeholder="visitor@wildland.org">
        </div>
        <div class="form-group">
          <label class="form-label">PASSWORD</label>
          <input type="password" id="password" class="form-input" required placeholder="••••••••">
        </div>
        <div id="login-error" style="color: #FF4D4D; font-family: var(--font-mono); font-size: 11px; margin-bottom: 12px; display: none;"></div>
        <button type="submit" class="btn btn-primary btn-block">AUTHENTICATE</button>
      </form>

      <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border-color); text-align: center;">
        <a href="/visitor/face-login" class="btn btn-block" style="background: var(--bg-surface-elevated); margin-bottom: 8px;">
          FACE BIOMETRIC LOGIN
        </a>
        <a href="/visitor/register" style="color: var(--text-muted); font-size: 12px; text-decoration: none;">New visitor? Register profile & biometrics</a>
      </div>
    </div>
  </main>

  <script src="/visitor/static/js/auth.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errEl = document.getElementById("login-error");

      errEl.style.display = "none";
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, expected_role: "VISITOR" })
        });
        const data = await res.json();
        if (res.ok) {
          if (data.user && data.user.role !== "VISITOR") {
            errEl.textContent = "Access Denied: Officer accounts cannot log in to the Visitor Portal. Please use the Officer Tactical Portal at /officer/login.";
            errEl.style.display = "block";
            return;
          }
          VisitorAuth.setSession(data.token, data.user, data.profile);
          window.location.href = "/visitor/dashboard";
        } else {
          errEl.textContent = data.error || "Authentication failed.";
          errEl.style.display = "block";
        }
      } catch (err) {
        errEl.textContent = "Unable to connect to gateway.";
        errEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
