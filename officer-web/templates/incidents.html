<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incident Queue - Smart Forest SAR</title>
  <link rel="stylesheet" href="/officer/static/css/officer.css">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <header class="officer-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <a href="/officer/dashboard" class="btn" style="padding: 2px 8px; font-size: 11px;">&larr; RADAR</a>
      <strong style="text-transform: uppercase;">SAR Incident Queue</strong>
    </div>
  </header>

  <main class="officer-container">
    <div class="card">
      <div class="card-title">SEARCH & RESCUE INCIDENTS</div>
      <div id="officer-incident-feed">
        <div style="color: var(--text-muted); font-family: Consolas, monospace; text-align: center; padding: 20px;">
          LOADING INCIDENTS...
        </div>
      </div>
    </div>
  </main>

  <script src="/officer/static/js/auth.js"></script>
  <script src="/officer/static/js/gps.js"></script>
  <script src="/officer/static/js/incidents.js"></script>
